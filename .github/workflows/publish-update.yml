name: Publish Meme Radar Update

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-update.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build v3.0.0 Pre-Pump update
        shell: bash
        run: |
          set -euo pipefail

          test "$(wc -c < bootstrap300/part_00.txt)" -eq 7500
          cat bootstrap300/part_*.txt | base64 -d | gzip -d > /tmp/v300.patch
          PATCH_SHA="$(sha256sum /tmp/v300.patch | awk '{print $1}')"
          EXPECTED_PATCH="39a760dc2aa33933de7e1455747c950b9fb0a408aac12bbb2292cdd789a04423"
          if [ "$PATCH_SHA" != "$EXPECTED_PATCH" ]; then
            echo "Patch SHA mismatch: $PATCH_SHA"
            exit 1
          fi

          rm -rf /tmp/meme-radar-app
          mkdir -p /tmp/meme-radar-app
          unzip -q dist/app_bundle.zip -d /tmp/meme-radar-app
          test "$(tr -d '\r\n' < /tmp/meme-radar-app/VERSION)" = "2.9.3"

          (
            cd /tmp/meme-radar-app
            patch -p1 < /tmp/v300.patch
            test "$(tr -d '\r\n' < VERSION)" = "3.0.0"
            PYTHONDONTWRITEBYTECODE=1 python3 test_strategy.py
            PYTHONDONTWRITEBYTECODE=1 python3 -m compileall -q .
          )

          rm -rf /tmp/meme-radar-app/__pycache__ /tmp/meme-radar-app/core/__pycache__
          rm -f dist/app_bundle.zip
          (
            cd /tmp/meme-radar-app
            zip -qr "$GITHUB_WORKSPACE/dist/app_bundle.zip" .
          )

          SHA="$(sha256sum dist/app_bundle.zip | awk '{print $1}')"
          cat > update.json <<EOF
          {
            "version": "3.0.0",
            "bundle_url": "https://raw.githubusercontent.com/reazzy1/skobin-meme-radar/main/dist/app_bundle.zip",
            "sha256": "$SHA",
            "notes": "Pre-Pump Detector: ускорение holders и транзакций, fresh buy pressure, volume velocity, net buy, ранний PRE-PUMP сигнал, усиленный risk screen, авто-тесты и Strategy Lab с 2x за 15/60 минут.",
            "published_at": "2026-09-24T20:12:00+03:00",
            "min_bootstrap_version": "2.5"
          }
          EOF

      - name: Publish v3.0.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Skobin Meme Radar Updater"
          git config user.email "actions@users.noreply.github.com"
          rm -rf bootstrap300
          git add -A dist/app_bundle.zip update.json bootstrap300
          git commit -m "Publish v3.0.0 Pre-Pump Detector [skip ci]"
          git push
