name: Publish Meme Radar Update

on:
  workflow_dispatch:
  push:
    paths:
      - "publish_v28.txt"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build v2.8.0 update bundle
        shell: bash
        run: |
          set -u
          rm -rf /tmp/meme-radar-app /tmp/v28.patch /tmp/v28-debug.txt
          mkdir -p /tmp/meme-radar-app
          {
            echo "== files =="
            ls -l dist/app_bundle.zip bootstrap28/patch.b64.gz.txt
            echo "== unzip base =="
          } >> /tmp/v28-debug.txt 2>&1

          unzip -q dist/app_bundle.zip -d /tmp/meme-radar-app >> /tmp/v28-debug.txt 2>&1
          U=$?
          echo "unzip_exit=$U" >> /tmp/v28-debug.txt

          base64 -d bootstrap28/patch.b64.gz.txt | gunzip > /tmp/v28.patch
          D=$?
          echo "decode_exit=$D patch_bytes=$(wc -c < /tmp/v28.patch 2>/dev/null || echo 0)" >> /tmp/v28-debug.txt
          head -n 8 /tmp/v28.patch >> /tmp/v28-debug.txt 2>&1

          (
            cd /tmp/meme-radar-app
            patch --batch --forward -p4 < /tmp/v28.patch
          ) >> /tmp/v28-debug.txt 2>&1
          P=$?
          echo "patch_exit=$P" >> /tmp/v28-debug.txt

          V="$(tr -d '\r\n' < /tmp/meme-radar-app/VERSION 2>/dev/null || true)"
          echo "version=$V" >> /tmp/v28-debug.txt

          python -m py_compile /tmp/meme-radar-app/desktop_app.py /tmp/meme-radar-app/engine.py /tmp/meme-radar-app/core/*.py >> /tmp/v28-debug.txt 2>&1
          C=$?
          echo "compile_exit=$C" >> /tmp/v28-debug.txt

          if [ "$U" -ne 0 ] || [ "$D" -ne 0 ] || [ "$P" -ne 0 ] || [ "$C" -ne 0 ] || [ "$V" != "2.8.0" ]; then
            cp /tmp/v28-debug.txt debug_v28.txt
            git config user.name "Skobin Meme Radar Updater"
            git config user.email "actions@users.noreply.github.com"
            git add debug_v28.txt
            git commit -m "Save v2.8 publisher diagnostics [skip ci]" || true
            git push || true
            cat /tmp/v28-debug.txt
            exit 1
          fi

          rm -rf /tmp/meme-radar-app/__pycache__ /tmp/meme-radar-app/core/__pycache__
          rm -f dist/app_bundle.zip
          (
            cd /tmp/meme-radar-app
            zip -qr "$GITHUB_WORKSPACE/dist/app_bundle.zip" .
          )

          SHA="$(sha256sum dist/app_bundle.zip | awk '{print $1}')"
          cat > update.json <<EOF
          {
            "version": "2.8.0",
            "bundle_url": "https://raw.githubusercontent.com/reazzy1/skobin-meme-radar/main/dist/app_bundle.zip",
            "sha256": "$SHA",
            "notes": "Тест-ставки: для любой найденной монеты можно задать виртуальную сумму в долларах и отслеживать, во что она превращается. Добавлены ручной тест из радара, авто-тест $10 на ENTRY, текущая стоимость/PnL, лучший и худший момент и фиксация результата.",
            "published_at": "2026-09-24T15:35:00+03:00",
            "min_bootstrap_version": "2.5"
          }
          EOF

      - name: Publish v2.8.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Skobin Meme Radar Updater"
          git config user.email "actions@users.noreply.github.com"
          rm -rf bootstrap28 publish_v28.txt debug_v28.txt
          git add -A dist/app_bundle.zip update.json bootstrap28 publish_v28.txt debug_v28.txt
          git commit -m "Publish v2.8.0 Test Bets [skip ci]"
          git push
