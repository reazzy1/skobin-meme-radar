name: Publish Meme Radar Update

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-update.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build v2.9.0 update bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/meme-radar-app
          mkdir -p /tmp/meme-radar-app
          git show 5149bc99741c246a834fcea06dc7482782ed2444:dist/app_bundle.zip > /tmp/base-v28.zip
          unzip -q /tmp/base-v28.zip -d /tmp/meme-radar-app
          mv /tmp/meme-radar-app/desktop_app.py /tmp/meme-radar-app/desktop_app_v28.py
          cp overlay29/desktop_app.py /tmp/meme-radar-app/desktop_app.py
          printf '2.9.0\n' > /tmp/meme-radar-app/VERSION
          rm -f dist/app_bundle.zip
          (
            cd /tmp/meme-radar-app
            zip -qr "$GITHUB_WORKSPACE/dist/app_bundle.zip" .
          )
          SHA="$(sha256sum dist/app_bundle.zip | awk '{print $1}')"
          cat > update.json <<EOF
          {
            "version": "2.9.0",
            "bundle_url": "https://raw.githubusercontent.com/reazzy1/skobin-meme-radar/main/dist/app_bundle.zip",
            "sha256": "$SHA",
            "notes": "Понятная диагностика GMGN: теперь видно, почему новые Crowd-сигналы не появляются. Добавлена новая иконка окна приложения.",
            "published_at": "2026-09-24T16:45:00+03:00",
            "min_bootstrap_version": "2.5"
          }
          EOF

      - name: Publish v2.9.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Skobin Meme Radar Updater"
          git config user.email "actions@users.noreply.github.com"
          rm -rf overlay29
          git add -A dist/app_bundle.zip update.json overlay29
          git commit -m "Publish v2.9.0 GMGN diagnostics and icon [skip ci]"
          git push
