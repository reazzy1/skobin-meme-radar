name: Publish Meme Radar Update

on:
  workflow_dispatch:
  push:
    paths:
      - "publish_v28.txt"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble v2.8.0 update bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cat bootstrap28/part_*.txt | base64 -d > dist/app_bundle.zip

          SHA="$(sha256sum dist/app_bundle.zip | awk '{print $1}')"
          EXPECTED="8a01d456b4128f2f418c0a4c44ff2a126bf2add7ce25e848c0ff8555c76875e5"
          if [ "$SHA" != "$EXPECTED" ]; then
            echo "Bundle SHA mismatch: $SHA"
            exit 1
          fi

          cat > update.json <<EOF
          {
            "version": "2.8.0",
            "bundle_url": "https://raw.githubusercontent.com/reazzy1/skobin-meme-radar/main/dist/app_bundle.zip",
            "sha256": "$SHA",
            "notes": "Тест-ставки: для любой найденной монеты можно задать виртуальную сумму в долларах и отслеживать, во что она превращается. Добавлены ручной тест из радара, авто-тест $10 на ENTRY, текущая стоимость/PnL, лучший и худший момент и фиксация результата.",
            "published_at": "2026-09-24T15:35:00+03:00",
            "min_bootstrap_version": "2.5"
          }
          EOF

      - name: Publish v2.8.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Skobin Meme Radar Updater"
          git config user.email "actions@users.noreply.github.com"
          rm -rf bootstrap28 publish_v28.txt
          git add -A dist/app_bundle.zip update.json bootstrap28 publish_v28.txt
          git commit -m "Publish v2.8.0 Test Bets [skip ci]"
          git push
