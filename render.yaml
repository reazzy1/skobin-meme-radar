services:
  - type: web
    name: skobin-meme-radar-bot
    runtime: docker
    dockerfilePath: ./cloud/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GMGN_API_KEY
        sync: false
